<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Planner</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
</head>

<body class="bg-slate-100 text-slate-800 p-6">

  <!-- Two-Column Main Layout Container -->
  <main class="max-w-7xl mx-auto flex flex-col md:flex-row gap-6 items-start">

    <!-- Left Column: Widget Column -->
    <div class="flex-shrink-0 flex flex-col">
      <div class="mb-6 h-[32px] hidden md:block"></div>
      <aside class="w-fit bg-white p-2 rounded-xl shadow-sm border border-slate-200 flex justify-center">
        <script src="https://halfstaff.org/widgets/us-half-staff-flags.js"></script>
      </aside>
    </div>

    <!-- Right Column: Calendar Column -->
    <div class="flex-1 min-w-0 w-full flex flex-col">
      <header class="mb-6 flex justify-between items-center min-h-[32px]">
        <h1 class="text-2xl font-bold text-slate-900">📚 Lesson Planner</h1>
        <div id="sync-status" class="text-sm font-medium text-slate-500">
          Status: Ready
        </div>
      </header>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div id="calendar"></div>
      </div>
    </div>

  </main>

  <!-- Lesson Plan Editor Modal -->
  <div id="lesson-modal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
      <button id="close-modal" type="button"
        class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      <h2 id="modal-title" class="text-xl font-bold mb-4">Lesson Plan</h2>

      <form id="lesson-form" class="space-y-4">
        <input type="hidden" id="lesson-id">

        <div>
          <label class="block text-sm font-medium text-slate-700">Title</label>
          <input type="text" id="lesson-title" required class="w-full mt-1 p-2 border rounded-md">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">Subject</label>
            <input type="text" id="lesson-subject" class="w-full mt-1 p-2 border rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Grade Level</label>
            <input type="text" id="lesson-grade" class="w-full mt-1 p-2 border rounded-md">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-sm font-medium text-slate-700">Date</label>
            <input type="date" id="lesson-date" required class="w-full mt-1 p-2 border rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Start Time</label>
            <input type="time" id="lesson-start" required class="w-full mt-1 p-2 border rounded-md">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">End Time</label>
            <input type="time" id="lesson-end" required class="w-full mt-1 p-2 border rounded-md">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Objectives</label>
          <textarea id="lesson-objectives" rows="2" class="w-full mt-1 p-2 border rounded-md"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Procedure / Steps</label>
          <textarea id="lesson-procedure" rows="3" class="w-full mt-1 p-2 border rounded-md"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">Assessment</label>
          <textarea id="lesson-assessment" rows="2" class="w-full mt-1 p-2 border rounded-md"></textarea>
        </div>

        <!-- Materials Text Field + Add Link Button Section -->
        <div>
          <div class="flex justify-between items-center">
            <label class="block text-sm font-medium text-slate-700">Materials & Resources</label>
            <button type="button" id="toggle-add-link-btn"
              class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1">
              + Add Web Link
            </button>
          </div>

          <textarea id="lesson-materials" rows="2" placeholder="e.g. 25 Worksheets, Graph paper, Lab kits..."
            class="w-full mt-1 p-2 border rounded-md"></textarea>

          <!-- Inline Link Adding Box -->
          <div id="inline-link-box" class="hidden mt-2 p-3 bg-slate-50 border border-slate-200 rounded-md space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="link-title-input" placeholder="Link Title (e.g. Unit 3 Slides)"
                class="p-2 text-xs border rounded-md bg-white">
              <input type="url" id="link-url-input" placeholder="URL (https://...)"
                class="p-2 text-xs border rounded-md bg-white">
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" id="cancel-link-btn"
                class="px-3 py-1 text-xs border rounded bg-white hover:bg-slate-100">Cancel</button>
              <button type="button" id="confirm-link-btn"
                class="px-3 py-1 text-xs font-semibold bg-indigo-600 text-white rounded hover:bg-indigo-700">Add
                Link</button>
            </div>
          </div>

          <!-- Attached Link Badges Container -->
          <div id="attached-links-container" class="flex flex-wrap gap-2 mt-2"></div>
        </div>

        <!-- Multi-Date Duplication Panel -->
        <div id="duplicate-panel" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-md space-y-2">
          <label class="block text-xs font-bold text-amber-900">Duplicate to Additional Target Date(s):</label>
          <div class="flex gap-2">
            <input type="date" id="dup-date-input" class="p-1.5 text-sm border rounded-md bg-white flex-1">
            <button type="button" id="add-dup-date-btn"
              class="px-3 py-1.5 text-xs font-semibold bg-amber-600 text-white rounded hover:bg-amber-700">Add
              Date</button>
          </div>
          <div id="dup-dates-list" class="flex flex-wrap gap-1.5 mt-2"></div>
          <button type="button" id="confirm-dup-btn"
            class="w-full mt-2 py-1.5 text-xs font-bold bg-amber-600 text-white rounded hover:bg-amber-700 transition-colors">
            Copy Plan to Selected Target Dates
          </button>
        </div>

        <div class="flex justify-between items-center pt-4 border-t">
          <div class="flex gap-2">
            <button type="button" id="delete-btn"
              class="px-3 py-2 bg-red-100 text-red-600 text-sm rounded-md hover:bg-red-200 hidden">Delete</button>
            <button type="button" id="duplicate-btn"
              class="px-3 py-2 bg-amber-100 text-amber-800 text-sm font-medium rounded-md hover:bg-amber-200 hidden">Duplicate</button>
          </div>
          <div class="flex gap-2 ml-auto">
            <button type="button" id="cancel-btn"
              class="px-4 py-2 border text-sm rounded-md hover:bg-slate-50">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-md hover:bg-indigo-700">Save
              Plan</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Special Notes Modal -->
  <div id="note-modal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative">
      <button id="close-note-modal" type="button"
        class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      <h3 class="text-lg font-bold text-slate-900">Daily Special Notes</h3>
      <p id="note-modal-subtitle" class="text-xs text-slate-500 mb-4"></p>

      <div id="note-list" class="space-y-2 mb-4 max-h-48 overflow-y-auto"></div>

      <form id="note-form" class="flex gap-2">
        <input type="text" id="new-note-input" required placeholder="Add note (e.g., Substitute, Field Trip)..."
          class="flex-1 p-2 text-sm border rounded-md">
        <button type="submit"
          class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-md font-medium hover:bg-indigo-700">Add</button>
      </form>
      <div class="mt-4 pt-3 border-t text-right">
        <button type="button" id="done-note-btn"
          class="px-4 py-1.5 bg-slate-100 text-slate-700 text-sm rounded-md hover:bg-slate-200">Done</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6">
      <h3 id="confirm-modal-title" class="text-lg font-bold text-slate-900 mb-2"></h3>
      <p id="confirm-modal-message" class="text-sm text-slate-600 mb-6"></p>
      <div class="flex justify-end gap-3">
        <button type="button" id="confirm-cancel-btn"
          class="px-4 py-2 border text-sm rounded-md hover:bg-slate-50">Cancel</button>
        <button type="button" id="confirm-action-btn"
          class="px-4 py-2 bg-red-600 text-white text-sm rounded-md hover:bg-red-700 font-medium">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
